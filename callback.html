<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Authorization Received — CX Enterprises LLC</title>
<style>
body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:720px;
margin:3rem auto;padding:0 1.25rem;line-height:1.6;color:#1a1a2e;background:#fff}
h1{font-size:1.6rem;border-bottom:2px solid #1a1a2e;padding-bottom:.5rem}
code,textarea{font-family:ui-monospace,Menlo,Consolas,monospace}
textarea{width:100%;height:6rem;margin:.75rem 0;padding:.5rem;border:1px solid #999;border-radius:4px;font-size:.85rem}
button{padding:.5rem 1.1rem;border:0;border-radius:4px;background:#1a1a2e;color:#fff;cursor:pointer;font-size:1rem}
footer{margin-top:3rem;padding-top:1rem;border-top:1px solid #ccc;font-size:.85rem;color:#555}
.ok{color:#0a6b2d}
</style></head>
<body><h1>Authorization Received</h1>
<p class="ok" id="status">Checking parameters…</p>
<p>To finish connecting, copy the text below and paste it into the waiting
terminal prompt. This page runs entirely in your browser — nothing is sent
anywhere.</p>
<textarea id="url" readonly></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('url').value).then(()=>this.textContent='Copied ✓')">Copy</button>
<footer>CX Enterprises LLC · internal use · you can close this tab after pasting</footer>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('url').value = location.href;
document.getElementById('status').textContent =
  q.get('code') && q.get('realmId')
    ? 'Authorization parameters present — copy below and return to the terminal.'
    : 'No authorization parameters found — start the connect flow from the terminal first.';
</script>
</body></html>
